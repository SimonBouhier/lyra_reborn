<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" role="img" aria-label="Lyra Reborn">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0b1e"/>
      <stop offset="55%" stop-color="#1e1145"/>
      <stop offset="100%" stop-color="#3b1866"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e9d5ff"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="280" fill="url(#bg)"/>
  <rect width="1200" height="280" fill="url(#glow)"/>
  <!-- constellation nemeton -->
  <g stroke="#8b7bd8" stroke-opacity="0.45" stroke-width="1.2">
    <line x1="880" y1="70" x2="960" y2="120"/><line x1="960" y1="120" x2="1050" y2="80"/>
    <line x1="960" y1="120" x2="1010" y2="190"/><line x1="1010" y1="190" x2="1110" y2="160"/>
    <line x1="880" y1="70" x2="930" y2="200"/><line x1="930" y1="200" x2="1010" y2="190"/>
    <line x1="1050" y1="80" x2="1110" y2="160"/><line x1="820" y1="150" x2="880" y2="70"/>
    <line x1="820" y1="150" x2="930" y2="200"/>
  </g>
  <g fill="#c4b5fd">
    <circle cx="880" cy="70" r="5"/><circle cx="960" cy="120" r="7"/>
    <circle cx="1050" cy="80" r="4.5"/><circle cx="1010" cy="190" r="6"/>
    <circle cx="1110" cy="160" r="4"/><circle cx="930" cy="200" r="5"/>
    <circle cx="820" cy="150" r="4.5"/>
  </g>
  <!-- courbe de contrôle (ρ/δr/τc/κ) -->
  <path d="M 60 235 C 220 235 260 120 420 150 S 660 210 780 165"
        fill="none" stroke="#7dd3fc" stroke-opacity="0.55" stroke-width="2.5"/>
  <path d="M 60 245 C 230 245 280 160 430 180 S 650 235 780 195"
        fill="none" stroke="#a78bfa" stroke-opacity="0.4" stroke-width="1.8"/>
  <text x="62" y="118" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="58" font-weight="700" fill="url(#title)" letter-spacing="2">LYRA REBORN</text>
  <text x="64" y="158" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="21" fill="#cbd5e1" letter-spacing="0.5">Un OS cognitif pour LLM locaux — contrôle, mémoire vivante, exploration, jachère</text>
  <text x="64" y="196" font-family="Consolas, Menlo, monospace"
        font-size="15" fill="#94a3b8">ρ · δr · τc · κ   |   le LLM utilise Lyra ; il n'est pas Lyra</text>
</svg>
