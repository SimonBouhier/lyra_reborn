[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lyra_reborn"
version = "0.1.0.dev0"
description = "Lyra — couche de contrôle cognitive au-dessus d'un LLM local (Ollama). Consolidation honnête de ~23 prototypes audités."
requires-python = ">=3.10"
dependencies = []          # noyau P0/P1 : stdlib pure

[project.optional-dependencies]
llm = ["requests>=2.31"]            # client Ollama réel
research = ["numpy>=1.24", "matplotlib>=3.7"]  # nemeton/topologie (P2+)
evaluation = ["pydantic==2.13.4", "requests>=2.31"]
dev = ["pytest>=7.4"]

[tool.setuptools]
packages = ["core", "core.control", "core.metrics", "core.topology",
            "memory", "memory.graph", "memory.ecology", "memory.cbr",
            "explore", "explore.esmm", "agency", "agency.tools",
            "agency.tools.vigie",
            "app", "eval", "research"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
